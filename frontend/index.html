<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileLens - Intelligent File Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon">🔍</span>
                <span class="logo-text">FileLens</span>
            </div>
            
            <nav class="nav">
                <button class="nav-item active" data-view="search">
                    <span class="nav-icon">🔎</span>
                    <span>搜索</span>
                </button>
                <button class="nav-item" data-view="index">
                    <span class="nav-icon">📁</span>
                    <span>索引管理</span>
                </button>
                <button class="nav-item" data-view="stats">
                    <span class="nav-icon">📊</span>
                    <span>统计</span>
                </button>
                <button class="nav-item" data-view="settings">
                    <span class="nav-icon">⚙️</span>
                    <span>设置</span>
                </button>
            </nav>
            
            <div class="sidebar-footer">
                <div class="version">v1.0.0</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <!-- Search View -->
            <div class="view active" id="search-view">
                <header class="header">
                    <h1>智能文件搜索</h1>
                    <p class="subtitle">支持语义搜索和关键词搜索</p>
                </header>

                <div class="search-container">
                    <div class="search-box">
                        <input 
                            type="text" 
                            id="search-input" 
                            placeholder="输入搜索内容..."
                            autocomplete="off"
                        >
                        <button class="search-btn" id="search-btn">
                            <span>🔎</span>
                        </button>
                    </div>
                    
                    <div class="search-options">
                        <label class="option">
                            <input type="radio" name="search-mode" value="hybrid" checked>
                            <span>混合搜索</span>
                        </label>
                        <label class="option">
                            <input type="radio" name="search-mode" value="semantic">
                            <span>语义搜索</span>
                        </label>
                        <label class="option">
                            <input type="radio" name="search-mode" value="keyword">
                            <span>关键词搜索</span>
                        </label>
                    </div>
                </div>

                <div class="results-container" id="results-container">
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <p>输入关键词开始搜索</p>
                        <p class="empty-hint">支持搜索文档内容、代码文件、配置文件等</p>
                    </div>
                </div>
            </div>

            <!-- Index View -->
            <div class="view" id="index-view">
                <header class="header">
                    <h1>索引管理</h1>
                    <p class="subtitle">添加文件夹到搜索索引</p>
                </header>

                <div class="index-container">
                    <div class="index-actions">
                        <button class="btn btn-primary" id="add-folder-btn">
                            <span>📁</span>
                            添加文件夹
                        </button>
                        <button class="btn btn-secondary" id="clear-index-btn">
                            <span>🗑️</span>
                            清空索引
                        </button>
                    </div>

                    <div class="index-status" id="index-status">
                        <div class="status-item">
                            <span class="status-label">已索引文档</span>
                            <span class="status-value" id="doc-count">0</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">文本块</span>
                            <span class="status-value" id="chunk-count">0</span>
                        </div>
                    </div>

                    <div class="indexing-progress" id="indexing-progress" style="display: none;">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <p class="progress-text" id="progress-text">正在索引...</p>
                    </div>
                </div>
            </div>

            <!-- Stats View -->
            <div class="view" id="stats-view">
                <header class="header">
                    <h1>统计信息</h1>
                    <p class="subtitle">索引和搜索统计</p>
                </header>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">📄</div>
                        <div class="stat-value" id="stat-docs">0</div>
                        <div class="stat-label">已索引文档</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🧩</div>
                        <div class="stat-value" id="stat-chunks">0</div>
                        <div class="stat-label">文本块</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🔍</div>
                        <div class="stat-value" id="stat-searches">0</div>
                        <div class="stat-label">搜索次数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">⚡</div>
                        <div class="stat-value" id="stat-avg-time">0ms</div>
                        <div class="stat-label">平均响应</div>
                    </div>
                </div>

                <div class="file-types" id="file-types">
                    <h3>文件类型分布</h3>
                    <div class="type-list" id="type-list"></div>
                </div>
            </div>

            <!-- Settings View -->
            <div class="view" id="settings-view">
                <header class="header">
                    <h1>设置</h1>
                    <p class="subtitle">配置搜索参数</p>
                </header>

                <div class="settings-container">
                    <div class="setting-item">
                        <label>最大搜索结果数</label>
                        <input type="number" id="setting-max-results" value="20" min="5" max="100">
                    </div>
                    <div class="setting-item">
                        <label>相似度阈值</label>
                        <input type="range" id="setting-threshold" min="0" max="100" value="30">
                        <span class="threshold-value">0.3</span>
                    </div>
                    <div class="setting-item">
                        <label>文本块大小</label>
                        <select id="setting-chunk-size">
                            <option value="300">小 (300字符)</option>
                            <option value="500" selected>中 (500字符)</option>
                            <option value="1000">大 (1000字符)</option>
                        </select>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Result Item Template -->
    <template id="result-template">
        <div class="result-item">
            <div class="result-header">
                <span class="result-icon">📄</span>
                <span class="result-filename"></span>
                <span class="result-score"></span>
            </div>
            <div class="result-path"></div>
            <div class="result-highlights"></div>
            <div class="result-actions">
                <button class="action-btn open-btn">打开</button>
                <button class="action-btn folder-btn">在文件夹中显示</button>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
